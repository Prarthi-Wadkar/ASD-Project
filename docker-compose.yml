
services:
  database:
    image: postgres:15-alpine
    container_name: lf_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lost_and_found
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lost_and_found"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lf_backend
    environment:
      DATABASE_URL: postgresql://postgres:password@database:5432/lost_and_found
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: lf_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
