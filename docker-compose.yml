version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: lf_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lost_and_found
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: lf_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@database:5432/lost_and_found
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: lf_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend